<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamagotchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1f2328;
      --bg-mid: #3e4651;
      --shell-top: #f4e7b6;
      --shell-mid: #d9c98a;
      --shell-bottom: #b2975b;
      --shell-shadow: #7c6731;
      --shell-border: #4d3d1d;
      --screen-bg: #bfe4bb;
      --screen-border: #1d3b2d;
      --screen-inner: #7ba67f;
      --screen-text: #1c2c22;
      --button-top: #f4d7a4;
      --button-mid: #d59e58;
      --button-shadow: #7e5922;
      --button-border: #3b2b16;
      --panel: rgba(34, 52, 37, 0.09);
      --lcd-green: #2f8a4a;
      --lcd-green-deep: #184a2f;
      --white: #f9f5e8;
      --device-shadow: rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, var(--bg-mid), var(--bg-dark) 62%);
      font-family: "Press Start 2P", "Courier New", monospace;
      color: var(--screen-text);
      letter-spacing: 0.04em;
      overflow: hidden;
    }

    .device {
      position: relative;
      width: 380px;
      padding: 26px 18px 22px;
      background: linear-gradient(180deg, var(--shell-top) 0%, var(--shell-mid) 22%, var(--shell-bottom) 100%);
      border: 5px solid var(--shell-border);
      border-radius: 38px 38px 30px 30px;
      box-shadow:
        inset -10px -10px 0 rgba(92, 69, 24, 0.18),
        inset 8px 8px 0 rgba(255, 255, 255, 0.18),
        0 18px 26px var(--device-shadow),
        0 0 0 8px rgba(255,255,255,0.05);
    }

    .device::before,
    .device::after {
      content: "";
      position: absolute;
      top: 16px;
      width: 68px;
      height: 14px;
      background: rgba(122, 96, 36, 0.28);
      border-radius: 999px;
      z-index: 0;
    }

    .device::before {
      left: 22px;
    }

    .device::after {
      right: 22px;
    }

    .speaker {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .speaker span {
      display: block;
      width: 6px;
      height: 6px;
      background: rgba(58, 48, 27, 0.7);
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 340px;
      padding: 16px 12px 12px;
      background: linear-gradient(180deg, #d8f0d3 0%, var(--screen-bg) 100%);
      border: 6px solid var(--screen-border);
      border-radius: 18px;
      box-shadow:
        inset 0 0 0 4px rgba(17, 38, 28, 0.15),
        inset 0 0 0 10px rgba(125, 157, 116, 0.2);
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0) 28%,
        rgba(0,0,0,0.06) 100%
      );
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      line-height: 1.5;
      text-transform: uppercase;
      color: var(--screen-text);
    }

    .bars {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 9px;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .bars div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      gap: 8px;
    }

    .bar {
      position: relative;
      width: 126px;
      height: 11px;
      background: rgba(29, 55, 39, 0.12);
      border: 2px solid rgba(23, 44, 33, 0.9);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .bar span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--lcd-green), var(--lcd-green-deep));
      transition: width 0.35s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    .pet-area {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      margin-top: 8px;
      border-radius: 10px;
      background: rgba(19, 41, 28, 0.05);
      overflow: hidden;
    }

    .pet-area::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid rgba(29, 55, 39, 0.14);
      border-radius: 8px;
    }

    #pet {
      position: relative;
      font-size: 92px;
      line-height: 1;
      user-select: none;
      filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.12));
      transform-origin: center bottom;
      transition: filter 0.2s ease;
      z-index: 1;
    }

    .bounce {
      animation: bounce 0.45s steps(2, end);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .sleeping #pet {
      filter: grayscale(0.4) brightness(0.85) drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.12));
    }

    #poop {
      position: absolute;
      right: 18px;
      bottom: 14px;
      font-size: 20px;
      filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.14));
      z-index: 1;
    }

    #message {
      position: relative;
      z-index: 1;
      min-height: 50px;
      padding-top: 10px;
      font-size: 9px;
      line-height: 1.5;
      text-align: center;
      text-transform: uppercase;
      color: var(--screen-text);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 8px;
      margin-top: 18px;
      position: relative;
      z-index: 2;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    button {
      position: relative;
      width: 62px;
      height: 62px;
      border: 4px solid var(--button-border);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--button-top) 0%, var(--button-mid) 100%);
      color: var(--white);
      font: inherit;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--button-shadow);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      text-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--button-shadow);
    }

    .label {
      margin-top: 8px;
      font-size: 8px;
      line-height: 1.5;
      text-transform: uppercase;
      color: #f9f5e8;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }

    .reset {
      display: block;
      margin: 20px auto 0;
      min-width: 126px;
      height: auto;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08);
      font-size: 8px;
      color: var(--white);
      box-shadow: none;
    }

    @media (max-width: 420px) {
      .device {
        width: min(90vw, 380px);
      }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="speaker" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="screen" id="screen">
      <div class="top">
        <span id="name">Tama</span>
        <span id="age">Age: 0</span>
      </div>

      <div class="bars">
        <div>Hunger <span class="bar"><span data-bar="hunger"></span></span></div>
        <div>Happy <span class="bar"><span data-bar="happy"></span></span></div>
        <div>Energy <span class="bar"><span data-bar="energy"></span></span></div>
      </div>

      <div class="pet-area">
        <div id="pet">🥚</div>
        <div id="poop"></div>
      </div>

      <div id="message"></div>
    </div>

    <div class="buttons">
      <div class="btn-wrap">
        <button id="feedBtn" title="Feed">🍙</button>
        <div class="label">Feed</div>
      </div>
      <div class="btn-wrap">
        <button id="playBtn" title="Play">🎾</button>
        <div class="label">Play</div>
      </div>
      <div class="btn-wrap">
        <button id="sleepBtn" title="Sleep / Wake">💤</button>
        <div class="label">Sleep</div>
      </div>
      <div class="btn-wrap">
        <button id="cleanBtn" title="Clean">🧹</button>
        <div class="label">Clean</div>
      </div>
    </div>

    <button class="reset" id="resetBtn">New pet</button>
  </div>

  <script>
    const SAVE_KEY = "tamagotchi-save-v1";
    const MAX_CATCHUP_SECONDS = 3600;
    const AGE_SECONDS_PER_STAGE = 240; // 1 age step every 4 minutes

    const el = {
      screen: document.getElementById("screen"),
      pet: document.getElementById("pet"),
      poop: document.getElementById("poop"),
      age: document.getElementById("age"),
      name: document.getElementById("name"),
      message: document.getElementById("message"),
    };

    let state = load() || newPet();

    function newPet() {
      return {
        hunger: 80,
        happy: 80,
        energy: 80,
        poop: 0,
        age: 0,
        starving: 0,
        asleep: false,
        alive: true,
        lastSeen: Date.now(),
      };
    }

    function clamp(v) {
      return Math.max(0, Math.min(100, v));
    }

    function update(dt) {
      if (!state.alive) return;

      state.age += dt / AGE_SECONDS_PER_STAGE;

      if (state.asleep) {
        state.energy = clamp(state.energy + 2 * dt);
        state.hunger = clamp(state.hunger - 0.02 * dt);
        state.happy = clamp(state.happy - 0.02 * dt);
        if (state.energy >= 100) {
          state.asleep = false;
          say("Good morning! I'm awake.");
        }
      } else {
        state.energy = clamp(state.energy - 0.03 * dt);
        state.hunger = clamp(state.hunger - 0.05 * dt);
        state.happy = clamp(state.happy - 0.04 * dt);

        if (Math.random() < 0.01 * dt && state.poop < 4) {
          state.poop++;
        }
      }

      if (state.poop >= 3) {
        state.happy = clamp(state.happy - 0.05 * dt);
      }

      if (state.hunger <= 0) {
        state.starving += dt;
        if (state.starving > 60) {
          state.alive = false;
          say("Tama has passed away. Press New pet to start over.");
        }
      } else {
        state.starving = 0;
      }
    }

    function say(text) {
      el.message.textContent = text;
    }

    function requireAlive() {
      if (!state.alive) {
        say("Tama is gone. Press New pet.");
        return false;
      }
      return true;
    }

    function bounce() {
      el.pet.classList.remove("bounce");
      void el.pet.offsetWidth;
      el.pet.classList.add("bounce");
    }

    function feed() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.hunger >= 100) return say("I'm too full!");
      state.hunger = clamp(state.hunger + 25);
      state.happy = clamp(state.happy + 3);
      say("Yum! Thank you!");
      bounce();
    }

    function play() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.energy < 15) return say("I'm too tired to play.");
      state.happy = clamp(state.happy + 20);
      state.energy = clamp(state.energy - 10);
      state.hunger = clamp(state.hunger - 5);
      say("Wheee! That was fun!");
      bounce();
    }

    function toggleSleep() {
      if (!requireAlive()) return;
      if (state.asleep) {
        state.asleep = false;
        say("I'm awake!");
      } else {
        state.asleep = true;
        say("Zzz...");
      }
    }

    function clean() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.poop === 0) return say("Nothing to clean here.");
      state.poop--;
      state.happy = clamp(state.happy + 5);
      say("All clean!");
      bounce();
    }

    function getMood() {
      if (!state.alive) return "💀";
      if (state.asleep) return "😴";
      if (state.hunger < 25 || state.happy < 25) return "😢";
      if (state.energy < 20) return "🥱";
      if (state.age < 2) return "🐣";
      if (state.age < 5) return "🐥";
      return "🐤";
    }

    function render() {
      el.pet.textContent = getMood();
      el.screen.classList.toggle("sleeping", state.asleep);
      el.age.textContent = "Age: " + Math.floor(state.age);
      el.poop.textContent = "💩".repeat(state.poop);

      document.querySelector('[data-bar="hunger"]').style.width = state.hunger + "%";
      document.querySelector('[data-bar="happy"]').style.width = state.happy + "%";
      document.querySelector('[data-bar="energy"]').style.width = state.energy + "%";
    }

    function save() {
      state.lastSeen = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);

        const elapsed = Math.min(
          Math.floor((Date.now() - saved.lastSeen) / 1000),
          MAX_CATCHUP_SECONDS
        );
        for (let i = 0; i < elapsed; i++) {
          update(1);
        }
        return saved;
      } catch (e) {
        return null;
      }
    }

    document.getElementById("feedBtn").addEventListener("click", feed);
    document.getElementById("playBtn").addEventListener("click", play);
    document.getElementById("sleepBtn").addEventListener("click", toggleSleep);
    document.getElementById("cleanBtn").addEventListener("click", clean);
    document.getElementById("resetBtn").addEventListener("click", () => {
      state = newPet();
      say("Hello! I'm Tama!");
      save();
      render();
    });

    setInterval(() => {
      update(1);
      render();
      save();
    }, 1000);

    if (!state.alive) {
      say("Tama is gone. Press New pet.");
    } else {
      say("Hello! I'm Tama!");
    }
    render();
  </script>
</body>
</html>
