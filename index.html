<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c2329">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
  <title>Tamagotchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1c2329;
      --bg-mid: #39444f;
      --shell-top: #f3e7ae;
      --shell-mid: #d7c387;
      --shell-bottom: #b48f57;
      --shell-shadow: #7a5d2e;
      --shell-border: #4b3519;
      --screen-bg: #cce6c5;
      --screen-border: #204033;
      --screen-text: #1f2d2a;
      --button-top: #f5d5a1;
      --button-mid: #d9a05d;
      --button-shadow: #7e5522;
      --button-border: #3a2a1a;
      --white: #fefaf0;
      --screen-panel: rgba(25, 46, 36, 0.06);
      --device-shadow: rgba(0, 0, 0, 0.32);
      --pet-shadow: rgba(22, 40, 31, 0.15);
      --poop-dark: #5c3829;
      --poop-mid: #7d533d;
      --poop-light: #a56d4b;
      --fart-cloud: rgba(130, 145, 160, 0.55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }

    body {
      display: flex;
      padding: 16px;
      background: radial-gradient(circle at top, var(--bg-mid), var(--bg-dark) 62%);
      background-attachment: fixed;
      font-family: "Press Start 2P", "Courier New", monospace;
      color: var(--screen-text);
      letter-spacing: 0.04em;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .device {
      position: relative;
      /* margin: auto centers safely: no clipping when taller than the viewport */
      margin: auto;
      width: 390px;
      max-width: 100%;
      padding: 26px 18px 22px;
      background: linear-gradient(180deg, var(--shell-top) 0%, var(--shell-mid) 25%, var(--shell-bottom) 100%);
      border: 5px solid var(--shell-border);
      border-radius: 38px 38px 30px 30px;
      box-shadow:
        inset -10px -10px 0 rgba(92, 69, 24, 0.18),
        inset 8px 8px 0 rgba(255,255,255,0.18),
        0 18px 26px var(--device-shadow),
        0 0 0 8px rgba(255,255,255,0.04);
    }

    .device::before,
    .device::after {
      content: "";
      position: absolute;
      top: 16px;
      width: 68px;
      height: 14px;
      background: rgba(122, 96, 36, 0.28);
      border-radius: 999px;
      z-index: 0;
    }

    .device::before { left: 22px; }
    .device::after { right: 22px; }

    .speaker {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      z-index: 1;
    }

    .speaker span {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(55, 42, 24, 0.7);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 340px;
      padding: 16px 12px 12px;
      border: 6px solid var(--screen-border);
      border-radius: 18px;
      background: linear-gradient(180deg, #daf1d8 0%, var(--screen-bg) 100%);
      box-shadow:
        inset 0 0 0 4px rgba(17, 38, 28, 0.15),
        inset 0 0 0 10px rgba(125, 157, 116, 0.2);
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0) 28%,
        rgba(0,0,0,0.06) 100%
      );
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      line-height: 1.5;
      text-transform: uppercase;
      color: var(--screen-text);
    }

    .bars {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 9px;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .bars div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      gap: 8px;
    }

    .bar {
      position: relative;
      width: 126px;
      height: 11px;
      background: rgba(29, 55, 39, 0.12);
      border: 2px solid rgba(23, 44, 33, 0.9);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .bar span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2f8a4a, #184a2f);
      transition: width 0.35s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    .pet-area {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      margin-top: 8px;
      border-radius: 10px;
      background: var(--screen-panel);
      overflow: hidden;
    }

    .pet-area::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid rgba(29, 55, 39, 0.14);
      border-radius: 8px;
    }

    #pet {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 144px;
      user-select: none;
      transform-origin: center bottom;
      transition: filter 0.2s ease, transform 0.2s ease;
      z-index: 1;
    }

    .pet-svg {
      display: block;
      width: 180px;
      height: 144px;
      filter: drop-shadow(3px 3px 0 var(--pet-shadow));
    }

    .egg #pet { animation: eggFloat 1.5s ease-in-out infinite; }
    .hatching #pet { animation: hatchPulse 0.75s ease-in-out infinite alternate; }
    .bounce { animation: bounce 0.42s steps(2, end); }

    @keyframes eggFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-10px) rotate(2deg) scale(1.04); }
    }

    @keyframes hatchPulse {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.08) rotate(3deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .sleeping .pet-svg {
      filter: grayscale(0.35) brightness(0.8) drop-shadow(3px 3px 0 var(--pet-shadow));
    }

    .dead .pet-svg {
      filter: grayscale(1) brightness(0.9) drop-shadow(3px 3px 0 var(--pet-shadow));
      opacity: 0.85;
    }

    #poop {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 4px;
      width: 92px;
      height: 44px;
      z-index: 1;
      transform: translateY(0);
    }

    .poop-blob {
      position: relative;
      display: inline-block;
      width: var(--poop-size, 12px);
      height: var(--poop-height, 10px);
      transform: rotate(var(--poop-rotation, 0deg));
      border-radius: 58% 42% 60% 40% / 60% 46% 54% 40%;
      background: linear-gradient(145deg, var(--poop-light) 0%, var(--poop-mid) 36%, var(--poop-dark) 100%);
      box-shadow:
        inset 5px 1px 0 rgba(255,255,255,0.13),
        inset -4px -5px 0 rgba(42, 30, 25, 0.18),
        0 2px 0 rgba(66, 42, 28, 0.2);
      animation: poopWiggle 1.8s ease-in-out infinite alternate;
    }

    .poop-blob::before,
    .poop-blob::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    .poop-blob::before {
      width: 28%;
      height: 24%;
      left: 18%;
      top: 18%;
    }

    .poop-blob::after {
      width: 16%;
      height: 18%;
      right: 20%;
      bottom: 18%;
      background: rgba(0,0,0,0.12);
    }

    @keyframes poopWiggle {
      0% { transform: rotate(var(--poop-rotation, 0deg)) translateY(0); }
      100% { transform: rotate(calc(var(--poop-rotation, 0deg) + 10deg)) translateY(2px); }
    }

    .action-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .action {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .action.feed .food {
      position: absolute;
      left: 50%;
      top: 48%;
      font-size: 34px;
      transform: translate(-50%, -50%) scale(0.7) rotate(-12deg);
      animation: foodDrop 0.8s ease-out forwards;
    }

    .action.play .ball {
      position: absolute;
      left: 18%;
      top: 52%;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 35% 30%, #eef77a, #cfe63c 55%, #9db820 100%);
      border: 2px solid #7d9418;
      box-shadow: 0 2px 0 rgba(70, 85, 20, 0.45);
      animation: ballToss 0.9s ease-in-out forwards;
    }

    /* Tennis-ball seams: two white arcs, clipped by the ball's round edge */
    .action.play .ball::before,
    .action.play .ball::after {
      content: "";
      position: absolute;
      top: -2px;
      width: 100%;
      height: calc(100% + 4px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.92);
    }

    .action.play .ball::before { left: -62%; }
    .action.play .ball::after { right: -62%; }

    .action.clean .broom {
      position: absolute;
      left: -18%;
      top: 52%;
      font-size: 34px;
      transform: rotate(18deg) scale(0.8);
      animation: broomSweep 1s ease-in-out forwards;
    }

    .action.clean .dust {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(128, 96, 77, 0.55);
      animation: dustScatter 0.8s ease-out forwards;
    }

    .action.clean .poop-spark {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--poop-light), var(--poop-dark));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
      animation: poopScatter 0.9s ease-out forwards;
    }

    .action.bath .splash {
      position: absolute;
      left: 50%;
      top: 56%;
      width: 82px;
      height: 42px;
      transform: translate(-50%, -50%) scale(0.7);
      border-radius: 50%;
      border: 5px solid rgba(97, 170, 255, 0.75);
      background: rgba(130, 210, 255, 0.28);
      animation: splashBurst 0.9s ease-out forwards;
    }

    .action.bath .drop {
      position: absolute;
      left: 50%;
      top: 38%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(116, 191, 255, 0.8);
      animation: dropFall 0.9s ease-in-out forwards;
    }

    .action.bath .bubble {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 3px solid rgba(130, 210, 255, 0.8);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      animation: bubbleRise 1s ease-in-out forwards;
    }

    .action.train .star {
      position: absolute;
      left: 26%;
      top: 46%;
      font-size: 28px;
      transform: scale(0.4) rotate(-12deg);
      animation: starJump 0.9s ease-in-out forwards;
    }

    .action.train .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 204, 77, 0.9);
      animation: sparkBurst 0.7s ease-out forwards;
    }

    .action.sleep .zzz {
      position: absolute;
      left: 56%;
      top: 34%;
      font-size: 16px;
      font-weight: 700;
      color: rgba(31, 45, 42, 0.8);
      animation: zzzRise 1.4s ease-out forwards;
    }

    .action.sleep .zzz:nth-child(2) { left: 62%; top: 26%; font-size: 20px; animation-delay: 0.3s; }
    .action.sleep .zzz:nth-child(3) { left: 69%; top: 16%; font-size: 24px; animation-delay: 0.6s; }

    @keyframes zzzRise {
      0% { opacity: 0; transform: translate(0, 10px) scale(0.6); }
      25%, 70% { opacity: 1; }
      100% { opacity: 0; transform: translate(14px, -22px) scale(1.1); }
    }

    .action.fart .fart-cloud {
      position: absolute;
      right: 20%;
      bottom: 24%;
      width: 74px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(138, 150, 160, 0.55), rgba(82, 89, 98, 0.32));
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08);
      animation: fartCloud 1s ease-out forwards;
    }

    .action.fart .fart-cloud::before,
    .action.fart .fart-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(153, 163, 172, 0.5), rgba(88, 96, 104, 0.22));
    }

    .action.fart .fart-cloud::before {
      width: 48px;
      height: 28px;
      left: 8px;
      top: -12px;
    }

    .action.fart .fart-cloud::after {
      width: 36px;
      height: 22px;
      right: 12px;
      top: 12px;
    }

    .action.fart .fart-label {
      position: absolute;
      right: 19%;
      bottom: 34%;
      font-size: 18px;
      transform: scale(0.8);
      animation: fartPop 1s ease-out forwards;
    }

    @keyframes foodDrop {
      0% { opacity: 0; transform: translate(-50%, -70%) scale(0.7) rotate(-12deg); }
      18% { opacity: 1; }
      56% { opacity: 1; transform: translate(-50%, 28px) scale(1.08) rotate(6deg); }
      100% { opacity: 0; transform: translate(-50%, 68px) scale(0.9) rotate(12deg); }
    }

    @keyframes ballToss {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5) rotate(0deg); }
      15% { opacity: 1; }
      45% { opacity: 1; transform: translate(65px, -60px) scale(1.1) rotate(240deg); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(130px, 0) scale(1) rotate(540deg); }
    }

    @keyframes broomSweep {
      0% { opacity: 0; transform: translate(-10px, 18px) rotate(20deg) scale(0.7); }
      18%, 72% { opacity: 1; }
      100% { opacity: 0; transform: translate(200px, -12px) rotate(-18deg) scale(0.9); }
    }

    @keyframes dustScatter {
      0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-42px, -18px) scale(1.3); }
    }

    @keyframes poopScatter {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      16% { opacity: 1; }
      100% { opacity: 0; transform: translate(56px, -18px) scale(1.2); }
    }

    @keyframes splashBurst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    @keyframes dropFall {
      0% { opacity: 0; transform: translate(-50%, -10px) scale(0.5); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, 58px) scale(1.2); }
    }

    @keyframes bubbleRise {
      0% { opacity: 0; transform: translate(0, 14px) scale(0.5); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(30px, -26px) scale(1.2); }
    }

    @keyframes starJump {
      0% { opacity: 0; transform: translate(-12px, 10px) scale(0.4) rotate(-12deg); }
      20%, 75% { opacity: 1; }
      100% { opacity: 0; transform: translate(90px, -40px) scale(1.2) rotate(18deg); }
    }

    @keyframes sparkBurst {
      0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(30px, -32px) scale(1.5); }
    }

    @keyframes fartCloud {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(42px, -12px) scale(1.5); }
    }

    @keyframes fartPop {
      0% { opacity: 0; transform: translate(0, 8px) scale(0.5); }
      20%, 80% { opacity: 1; }
      100% { opacity: 0; transform: translate(34px, -12px) scale(1.2); }
    }

    #message {
      position: relative;
      z-index: 1;
      min-height: 52px;
      padding-top: 10px;
      font-size: 9px;
      line-height: 1.45;
      text-align: center;
      text-transform: uppercase;
      color: var(--screen-text);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px 8px;
      margin-top: 18px;
      position: relative;
      z-index: 2;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    button {
      position: relative;
      width: 62px;
      height: 62px;
      border: 4px solid var(--button-border);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--button-top) 0%, var(--button-mid) 100%);
      color: var(--white);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--button-shadow);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      text-shadow: 0 2px 0 rgba(0,0,0,0.12);
      touch-action: manipulation;
    }

    button:hover,
    button:focus-visible {
      filter: brightness(1.03);
    }

    button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.9);
      outline-offset: 3px;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--button-shadow);
    }

    .label {
      margin-top: 8px;
      font-size: 8px;
      line-height: 1.5;
      text-transform: uppercase;
      color: #f9f5e8;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }

    .reset {
      display: block;
      margin: 20px auto 0;
      min-width: 126px;
      height: auto;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08);
      font-size: 8px;
      color: var(--white);
      box-shadow: none;
    }

    .reset.armed {
      background: rgba(190, 60, 40, 0.55);
      border-color: #fff;
    }

    @media (max-width: 420px) {
      .device { width: min(92vw, 390px); }
      .buttons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .bar { width: min(44vw, 126px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="device" aria-label="Tamagotchi game device">
    <div class="speaker" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="screen" id="screen">
      <div class="top">
        <span id="name">Egg</span>
        <span id="age">Age: 0</span>
      </div>

      <div class="bars" aria-label="Pet status bars">
        <div>Hunger <span class="bar"><span data-bar="hunger"></span></span></div>
        <div>Happy <span class="bar"><span data-bar="happy"></span></span></div>
        <div>Energy <span class="bar"><span data-bar="energy"></span></span></div>
      </div>

      <!-- No aria-live here: its contents refresh constantly. Updates are announced via #message only. -->
      <div class="pet-area" id="petArea">
        <div id="pet"></div>
        <div id="poop" aria-label="Poop pile"></div>
        <div class="action-layer" id="actionLayer" aria-hidden="true"></div>
      </div>

      <div id="message" aria-live="polite" aria-atomic="true"></div>
    </div>

    <div class="buttons" aria-label="Actions">
      <div class="btn-wrap">
        <button id="feedBtn" type="button" title="Feed" aria-label="Feed the pet">F</button>
        <div class="label">Feed</div>
      </div>
      <div class="btn-wrap">
        <button id="playBtn" type="button" title="Play" aria-label="Play with the pet">P</button>
        <div class="label">Play</div>
      </div>
      <div class="btn-wrap">
        <button id="sleepBtn" type="button" title="Sleep / Wake" aria-label="Put the pet to sleep or wake it">Z</button>
        <div class="label">Sleep</div>
      </div>
      <div class="btn-wrap">
        <button id="cleanBtn" type="button" title="Clean" aria-label="Clean up poop">C</button>
        <div class="label">Clean</div>
      </div>
      <div class="btn-wrap">
        <button id="bathBtn" type="button" title="Bath" aria-label="Give the pet a bath">B</button>
        <div class="label">Bath</div>
      </div>
      <div class="btn-wrap">
        <button id="trainBtn" type="button" title="Train" aria-label="Train the pet">T</button>
        <div class="label">Train</div>
      </div>
    </div>

    <button class="reset" id="resetBtn" type="button" aria-label="Start a new pet">New pet</button>
  </div>

  <script>
    const SAVE_KEY = "tamagotchi-save-v1";
    const MAX_CATCHUP_SECONDS = 3600;
    const AGE_SECONDS_PER_STAGE = 240;
    const HATCH_SECONDS = 4;
    const BATH_COOLDOWN_MS = 15000;
    const SLEEP_BLOCK_ENERGY = 90;

    // Evolution: age (in 4-minute units) triggers the next stage;
    // care quality at that moment picks the form.
    const STAGES = [
      { name: "Baby",   minAge: 0,   scale: 0.70 },
      { name: "Child",  minAge: 15,  scale: 0.82 },  // ~1 hour
      { name: "Teen",   minAge: 60,  scale: 0.92 },  // ~4 hours
      { name: "Adult",  minAge: 150, scale: 1.04 },  // ~10 hours
      { name: "Senior", minAge: 360, scale: 1.00 },  // ~24 hours
    ];
    const CARE_HORIZON_SECONDS = 1800; // how slowly care quality moves

    const speciesOptions = [
      { name: "Pip", primary: "#7ec6a8", secondary: "#dff9ee", accent: "#2d7a5d", ears: "short", tail: "round" },
      { name: "Momo", primary: "#b79ef7", secondary: "#efe7ff", accent: "#785dcb", ears: "pointed", tail: "curl" },
      { name: "Nori", primary: "#84d37d", secondary: "#e0ffd8", accent: "#2f7d4f", ears: "round", tail: "fan" },
      { name: "Bun", primary: "#f1c4c2", secondary: "#fff1ef", accent: "#d97973", ears: "long", tail: "poof" },
      { name: "Kiko", primary: "#f2b169", secondary: "#ffe9c8", accent: "#c66d33", ears: "short", tail: "round" },
      { name: "Dori", primary: "#96c8f7", secondary: "#e7f3ff", accent: "#4b7ec8", ears: "pointed", tail: "fan" }
    ];

    const el = {
      screen: document.getElementById("screen"),
      pet: document.getElementById("pet"),
      petArea: document.getElementById("petArea"),
      poop: document.getElementById("poop"),
      age: document.getElementById("age"),
      name: document.getElementById("name"),
      message: document.getElementById("message"),
      actionLayer: document.getElementById("actionLayer"),
      resetBtn: document.getElementById("resetBtn"),
      bars: {
        hunger: document.querySelector('[data-bar="hunger"]'),
        happy: document.querySelector('[data-bar="happy"]'),
        energy: document.querySelector('[data-bar="energy"]'),
      },
    };

    /* ---------- State ---------- */

    function randomSpecies() {
      return speciesOptions[Math.floor(Math.random() * speciesOptions.length)];
    }

    function newPet() {
      const species = randomSpecies();
      return {
        hunger: 80,
        happy: 80,
        energy: 80,
        poop: 0,
        age: 0,
        starving: 0,
        asleep: false,
        alive: true,
        lastSeen: Date.now(),
        lastBath: 0,
        speciesInfo: species,
        speciesName: species.name,
        egg: true,
        hatched: false,
        hatchTimer: 0,
        fartCooldown: 7 + Math.random() * 10,
        stage: 0,
        form: "plain",
        forms: ["plain"],  // form chosen at each stage, kept as history
        care: 70,          // running average of how well it's looked after (0-100)
      };
    }

    // Only reads and parses the save. Catch-up happens later, once `state` exists.
    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== "object") return null;
        // Merge over defaults so older saves missing newer fields still work
        return Object.assign(newPet(), saved);
      } catch (e) {
        return null;
      }
    }

    function save() {
      try {
        state.lastSeen = Date.now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch (e) {
        /* storage unavailable (private mode, quota): the game still runs */
      }
    }

    let state = load() || newPet();
    let carry = 0;           // leftover fractional seconds between ticks
    let lastTick = Date.now();

    function clamp(v) {
      return Math.max(0, Math.min(100, v));
    }

    function say(text) {
      el.message.textContent = text;
    }

    // Writes only when the value changed, so screen readers aren't re-notified every tick
    function setText(node, value) {
      if (node.textContent !== value) node.textContent = value;
    }

    function requireAlive() {
      if (!state.alive) {
        say("Tama is gone. Press New pet.");
        return false;
      }
      if (state.egg && !state.hatched) {
        say("The egg is hatching...");
        return false;
      }
      return true;
    }

    function bounce() {
      el.pet.classList.remove("bounce");
      void el.pet.offsetWidth;
      el.pet.classList.add("bounce");
    }

    /* ---------- Audio (one shared context) ---------- */

    let audioCtx = null;

    function getAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playTone(type) {
      try {
        const ctx = getAudio();
        if (!ctx) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const frequencies = {
          feed: [440, 660],
          play: [330, 510],
          clean: [180, 240],
          bath: [540, 780],
          train: [390, 660, 880],
          sleep: [320, 200],
          fart: [74, 54],
        };
        const f = frequencies[type];
        const t = ctx.currentTime;

        osc.type = type === "fart" ? "square" : "triangle";
        osc.frequency.setValueAtTime(f[0], t);
        osc.frequency.exponentialRampToValueAtTime(f[1], t + 0.08);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (type === "fart" ? 0.22 : 0.26));

        osc.start(t);
        osc.stop(t + (type === "fart" ? 0.28 : 0.32));
      } catch (e) {
        /* audio is optional */
      }
    }

    /* ---------- Action animations ---------- */

    function triggerAction(type) {
      const action = document.createElement("div");
      action.className = "action " + type;

      if (type === "feed") {
        action.innerHTML = '<div class="food">🍙</div>';
      } else if (type === "play") {
        action.innerHTML = '<div class="ball"></div>';
      } else if (type === "clean") {
        action.innerHTML = [
          '<div class="broom">🧹</div>',
          '<div class="dust" style="left: 72%; top: 62%;"></div>',
          '<div class="dust" style="left: 58%; top: 52%;"></div>',
          '<div class="poop-spark" style="left: 74%; top: 62%;"></div>',
          '<div class="poop-spark" style="left: 60%; top: 52%;"></div>'
        ].join("");
      } else if (type === "bath") {
        action.innerHTML = '<div class="splash"></div><div class="drop"></div><div class="bubble" style="left: 42%; top: 68%;"></div><div class="bubble" style="left: 52%; top: 70%;"></div><div class="bubble" style="left: 60%; top: 66%;"></div>';
      } else if (type === "train") {
        action.innerHTML = '<div class="star">⭐</div><div class="spark" style="left: 40%; top: 52%;"></div><div class="spark" style="left: 56%; top: 42%;"></div><div class="spark" style="left: 68%; top: 56%;"></div>';
      } else if (type === "sleep") {
        action.innerHTML = '<div class="zzz">Z</div><div class="zzz">Z</div><div class="zzz">Z</div>';
      } else if (type === "fart") {
        action.innerHTML = '<div class="fart-cloud" aria-hidden="true"></div><div class="fart-label" aria-hidden="true">💨</div>';
      }

      el.actionLayer.innerHTML = "";
      el.actionLayer.appendChild(action);
      setTimeout(() => {
        if (action.parentNode) action.remove();
      }, type === "sleep" ? 2100 : 1000);
    }

    function triggerFart(silent) {
      if (state.asleep || !state.alive || (state.egg && !state.hatched)) return;
      state.happy = clamp(state.happy - 2);
      state.fartCooldown = 8 + Math.random() * 15;
      if (silent) return; // catching up after time away: no sound or animation
      say("Pfft! Someone needs a little privacy.");
      triggerAction("fart");
      playTone("fart");
      bounce();
    }

    function hatchPet(silent) {
      state.egg = false;
      state.hatched = true;
      state.hatchTimer = 0;
      say("Peep! Hello, I'm " + state.speciesName + "!");
      if (!silent) bounce();
    }

    /* ---------- Evolution ---------- */

    function careForm() {
      return state.care >= 70 ? "bright" : state.care >= 40 ? "plain" : "scruffy";
    }

    function checkEvolution(silent) {
      while (state.stage < STAGES.length - 1 && state.age >= STAGES[state.stage + 1].minAge) {
        state.stage++;
        state.form = careForm();
        state.forms[state.stage] = state.form;
        if (!silent) {
          say("Wow! " + state.speciesName + " grew into a " + STAGES[state.stage].name + "!");
          triggerAction("train");
          playTone("train");
          bounce();
        }
      }
    }

    /* ---------- Simulation ---------- */

    function update(dt, silent) {
      if (!state.alive) return;

      if (state.egg && !state.hatched) {
        state.hatchTimer += dt;
        state.hunger = clamp(state.hunger - 0.02 * dt);
        state.happy = clamp(state.happy - 0.01 * dt);

        if (state.hatchTimer >= HATCH_SECONDS) {
          hatchPet(silent);
        }
        return;
      }

      state.age += dt / AGE_SECONDS_PER_STAGE;

      // Care quality: slow-moving average of the bars, minus a penalty for uncleaned poop
      const sample = (state.hunger + state.happy + state.energy) / 3 - state.poop * 5;
      state.care = clamp(state.care + (sample - state.care) * Math.min(1, dt / CARE_HORIZON_SECONDS));
      checkEvolution(silent);

      if (state.asleep) {
        state.energy = clamp(state.energy + 2 * dt);
        state.hunger = clamp(state.hunger - 0.02 * dt);
        state.happy = clamp(state.happy - 0.02 * dt);
        if (state.energy >= 100) {
          state.asleep = false;
          say("Good morning! I'm awake.");
        }
      } else {
        state.energy = clamp(state.energy - 0.03 * dt);
        state.hunger = clamp(state.hunger - 0.05 * dt);
        state.happy = clamp(state.happy - 0.04 * dt);

        if (Math.random() < 0.01 * dt && state.poop < 4) {
          state.poop++;
        }

        state.fartCooldown -= dt;
        if (state.fartCooldown <= 0) {
          const shouldFart = state.poop > 0 || Math.random() < 0.35;
          if (shouldFart) {
            triggerFart(silent);
          } else {
            state.fartCooldown = 8 + Math.random() * 15;
          }
        }
      }

      if (state.poop >= 3) {
        state.happy = clamp(state.happy - 0.05 * dt);
      }

      if (state.hunger <= 0) {
        state.starving += dt;
        if (state.starving > 60) {
          state.alive = false;
          say("Tama has passed away. Press New pet to start over.");
        }
      } else {
        state.starving = 0;
      }
    }

    // Advances the simulation by real elapsed seconds, in 1-second steps.
    // Long gaps (hidden tab, reopened page) run silently so nothing spams sounds.
    function advance(seconds) {
      const silent = seconds > 3;
      carry += Math.min(seconds, MAX_CATCHUP_SECONDS);
      while (carry >= 1) {
        update(1, silent);
        carry -= 1;
      }
    }

    function tick() {
      const now = Date.now();
      const elapsed = Math.max(0, (now - lastTick) / 1000);
      lastTick = now;
      advance(elapsed);
      render();
      save();
    }

    /* ---------- Actions ---------- */

    function feed() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.hunger >= 100) return say("I'm too full!");
      state.hunger = clamp(state.hunger + 25);
      state.happy = clamp(state.happy + 3);
      say("Yum! Thank you!");
      triggerAction("feed");
      playTone("feed");
      bounce();
    }

    function play() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.energy < 15) return say("I'm too tired to play.");
      state.happy = clamp(state.happy + 20);
      state.energy = clamp(state.energy - 10);
      state.hunger = clamp(state.hunger - 5);
      say("Wheee! That was fun!");
      triggerAction("play");
      playTone("play");
      bounce();
    }

    function toggleSleep() {
      if (!requireAlive()) return;
      if (state.asleep) {
        state.asleep = false;
        say("I'm awake!");
      } else {
        if (state.energy >= SLEEP_BLOCK_ENERGY) return say("I'm not sleepy yet.");
        state.asleep = true;
        say("Zzz...");
        triggerAction("sleep");
        playTone("sleep");
      }
    }

    function clean() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.poop === 0) return say("Nothing to clean here.");
      state.poop--;
      state.happy = clamp(state.happy + 5);
      say("All clean!");
      triggerAction("clean");
      playTone("clean");
      bounce();
    }

    function bath() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (Date.now() - (state.lastBath || 0) < BATH_COOLDOWN_MS) {
        return say("Already squeaky clean!");
      }
      state.lastBath = Date.now();
      state.happy = clamp(state.happy + 12);
      state.energy = clamp(state.energy + 6);
      state.hunger = clamp(state.hunger - 3);
      say("Fresh and clean!");
      triggerAction("bath");
      playTone("bath");
      bounce();
    }

    function train() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.energy < 20) return say("I'm too tired to train.");
      state.happy = clamp(state.happy + 18);
      state.energy = clamp(state.energy - 12);
      state.hunger = clamp(state.hunger - 8);
      say("I learned something new!");
      triggerAction("train");
      playTone("train");
      bounce();
    }

    /* ---------- Rendering ---------- */

    function getEarMarkup(species) {
      if (species.ears === "long") {
        return `
          <path d="M62 36 L42 5 L58 28 L62 36 Z" fill="${species.primary}" />
          <path d="M88 36 L108 5 L92 28 L88 36 Z" fill="${species.primary}" />
        `;
      }
      if (species.ears === "pointed") {
        return `
          <path d="M62 36 L53 12 L69 27 L62 36 Z" fill="${species.primary}" />
          <path d="M88 36 L97 12 L81 27 L88 36 Z" fill="${species.primary}" />
        `;
      }
      return `
        <ellipse cx="60" cy="26" rx="12" ry="18" fill="${species.primary}" />
        <ellipse cx="90" cy="26" rx="12" ry="18" fill="${species.primary}" />
      `;
    }

    function getTailMarkup(species) {
      if (species.tail === "curl") {
        return `<path d="M112 76 C126 70, 136 84, 128 96" fill="none" stroke="${species.primary}" stroke-width="8" stroke-linecap="round"/>`;
      }
      if (species.tail === "fan") {
        return `<path d="M112 76 C129 72, 138 82, 128 93 C120 88, 115 82, 112 76 Z" fill="${species.primary}" />`;
      }
      if (species.tail === "poof") {
        return `<circle cx="118" cy="76" r="10" fill="${species.primary}" />`;
      }
      return `<circle cx="116" cy="80" r="8" fill="${species.primary}" />`;
    }

    // Form and stage ornaments: sparkle (bright), messy tuft (scruffy), brows (senior)
    function getFormMarkup(species) {
      let out = "";
      if (state.form === "bright") {
        out += `<path d="M128 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffd54d"/>`;
      }
      if (state.form === "scruffy") {
        out += `<path d="M78 46 l4 -10 4 8 4 -9 4 11" fill="none" stroke="${species.accent}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      if (state.stage === STAGES.length - 1) {
        out += `<path d="M64 54 Q70 50 76 54 M94 54 Q100 50 106 54" fill="none" stroke="#f4f4f4" stroke-width="3" stroke-linecap="round"/>`;
      }
      return out;
    }

    function getMoodState() {
      if (state.egg && !state.hatched) return "egg";
      if (!state.alive) return "dead";
      if (state.asleep) return "sleepy";
      if (state.hunger < 25 || state.happy < 25) return "sad";
      if (state.energy < 20) return "tired";
      return "happy";
    }

    function getPetSvg() {
      if (state.egg && !state.hatched) {
        const crack = state.hatchTimer > HATCH_SECONDS * 0.7;
        return `
          <svg class="pet-svg" viewBox="0 0 170 140" aria-label="Egg" role="img">
            <g>
              <ellipse cx="85" cy="78" rx="46" ry="52" fill="#f4f8f5" stroke="#d0d9d0" stroke-width="4"/>
              <ellipse cx="85" cy="78" rx="36" ry="42" fill="#edf5ef"/>
              <path d="M74 61 C84 50, 95 50, 106 62" fill="none" stroke="#dfe8df" stroke-width="3" stroke-linecap="round"/>
              ${crack ? '<path d="M94 58 L108 70 L95 82" fill="none" stroke="#a88054" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />' : ''}
            </g>
          </svg>
        `;
      }

      const species = state.speciesInfo || speciesOptions[0];
      const stageInfo = STAGES[state.stage] || STAGES[0];
      const mood = getMoodState();
      const dead = mood === "dead";
      const asleep = mood === "sleepy";
      const sad = mood === "sad";
      const tired = mood === "tired";
      const mouthOpen = sad || tired || state.hunger < 20;
      const eyeY = asleep ? 69 : 64;
      const eyelids = asleep ? "<path d='M64 68 Q70 64 76 68' fill='none' stroke='#1d2b22' stroke-width='3' stroke-linecap='round' /><path d='M94 68 Q100 64 106 68' fill='none' stroke='#1d2b22' stroke-width='3' stroke-linecap='round' />" : "";
      const xEyes = `
        <path d="M65 59 L75 69 M75 59 L65 69" fill="none" stroke="#1d2b22" stroke-width="3" stroke-linecap="round"/>
        <path d="M95 59 L105 69 M105 59 L95 69" fill="none" stroke="#1d2b22" stroke-width="3" stroke-linecap="round"/>
      `;

      let eyes = "";
      if (dead) {
        eyes = xEyes;
      } else if (asleep) {
        eyes = eyelids;
      } else {
        eyes = `<circle cx="70" cy="${eyeY}" r="4" fill="#1d2b22"/><circle cx="100" cy="${eyeY}" r="4" fill="#1d2b22"/>
                <circle cx="68" cy="${eyeY - 2}" r="2" fill="#FFFFFF"/><circle cx="98" cy="${eyeY - 2}" r="2" fill="#FFFFFF"/>`;
      }

      const mouth = dead
        ? `<path d="M76 94 Q85 89 94 94" fill="none" stroke="${species.accent}" stroke-width="3" stroke-linecap="round"/>`
        : `<path d="M74 ${mouthOpen ? 88 : 92} Q85 ${mouthOpen ? 98 : 96} 96 ${mouthOpen ? 88 : 92}" fill="none" stroke="${species.accent}" stroke-width="3" stroke-linecap="round"/>`;

      // Body group scales from the feet so each stage grows upward from the ground
      return `
        <svg class="pet-svg" viewBox="0 0 170 140" aria-label="${dead ? state.speciesName + " (gone)" : state.speciesName + ", " + stageInfo.name}" role="img">
          <g transform="translate(85 104) scale(${stageInfo.scale}) translate(-85 -104)">
            <ellipse cx="84" cy="104" rx="54" ry="12" fill="rgba(0,0,0,0.10)"/>
            ${getTailMarkup(species)}
            ${getEarMarkup(species)}
            <ellipse cx="85" cy="82" rx="38" ry="32" fill="${species.primary}"/>
            <ellipse cx="85" cy="82" rx="31" ry="25" fill="${species.secondary}" opacity="0.8"/>
            <path d="M58 95 Q85 106 112 95" fill="none" stroke="${species.accent}" stroke-width="4" stroke-linecap="round"/>
            ${eyes}
            ${mouth}
            ${sad ? '<path d="M61 102 Q85 109 109 102" fill="none" stroke="#1f2d2a" stroke-width="3" stroke-linecap="round"/>' : ''}
            ${tired ? '<path d="M70 74 Q85 79 100 74" fill="none" stroke="rgba(29,43,34,0.6)" stroke-width="3" stroke-linecap="round"/>' : ''}
            <circle cx="65" cy="80" r="3" fill="${species.accent}" opacity="0.28"/>
            <circle cx="105" cy="80" r="3" fill="${species.accent}" opacity="0.28"/>
            ${getFormMarkup(species)}
          </g>
        </svg>
      `;
    }

    let lastSvg = "";
    let renderedPoop = -1;

    function renderPoop() {
      const count = Math.max(0, state.poop);
      if (count === renderedPoop) return; // unchanged: leave the wiggle animation alone
      renderedPoop = count;
      el.poop.innerHTML = Array.from({ length: count }, (_, index) => {
        const size = 10 + (index % 3) * 4;
        const height = 8 + (index % 2) * 4;
        const rotation = -18 + (index * 13) % 36;
        const offset = index * 4;
        return `<span class="poop-blob" style="--poop-size:${size}px; --poop-height:${height}px; --poop-rotation:${rotation}deg; margin-left:${index > 0 ? '-2px' : '0'}; transform: translateX(${offset}px) rotate(${rotation}deg);"></span>`;
      }).join("");
    }

    function render() {
      const svg = getPetSvg();
      if (svg !== lastSvg) {
        el.pet.innerHTML = svg;
        lastSvg = svg;
      }

      const inEgg = state.egg && !state.hatched;
      el.screen.classList.toggle("sleeping", state.alive && state.asleep && state.hatched);
      el.screen.classList.toggle("dead", !state.alive && state.hatched);
      el.screen.classList.toggle("egg", inEgg);
      el.screen.classList.toggle("hatching", inEgg && state.hatchTimer > HATCH_SECONDS * 0.75);

      const stageName = (STAGES[state.stage] || STAGES[0]).name;
      setText(el.name, inEgg ? "Egg" : (state.speciesName || "Tama") + " · " + stageName);
      setText(el.age, "Age: " + Math.floor(state.age));
      renderPoop();

      el.bars.hunger.style.width = state.hunger + "%";
      el.bars.happy.style.width = state.happy + "%";
      el.bars.energy.style.width = state.energy + "%";
    }

    /* ---------- New pet (two-step confirm) ---------- */

    let resetArmed = false;
    let resetTimer = null;

    function disarmReset() {
      resetArmed = false;
      clearTimeout(resetTimer);
      el.resetBtn.classList.remove("armed");
      el.resetBtn.textContent = "New pet";
    }

    function startOver() {
      state = newPet();
      carry = 0;
      lastTick = Date.now();
      renderedPoop = -1;
      lastSvg = "";
      say("A new egg is warming up...");
      save();
      render();
    }

    el.resetBtn.addEventListener("click", () => {
      const needsConfirm = state.alive && !(state.egg && !state.hatched);
      if (needsConfirm && !resetArmed) {
        resetArmed = true;
        el.resetBtn.classList.add("armed");
        el.resetBtn.textContent = "Confirm?";
        say("Start over? Tap again to confirm.");
        resetTimer = setTimeout(disarmReset, 3000);
        return;
      }
      disarmReset();
      startOver();
    });

    /* ---------- Wiring ---------- */

    document.getElementById("feedBtn").addEventListener("click", feed);
    document.getElementById("playBtn").addEventListener("click", play);
    document.getElementById("sleepBtn").addEventListener("click", toggleSleep);
    document.getElementById("cleanBtn").addEventListener("click", clean);
    document.getElementById("bathBtn").addEventListener("click", bath);
    document.getElementById("trainBtn").addEventListener("click", train);

    // Real-time based ticking: background tabs get throttled, so catch up on return
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) tick();
    });

    setInterval(tick, 1000);

    /* ---------- Startup ---------- */

    // Catch up on the time away (capped), now that `state` exists
    advance(Math.min((Date.now() - state.lastSeen) / 1000, MAX_CATCHUP_SECONDS));
    lastTick = Date.now();

    if (!state.alive) {
      say("Tama is gone. Press New pet.");
    } else if (state.egg && !state.hatched) {
      say("A new egg is warming up...");
    } else {
      say("Peep! Hello, I'm " + (state.speciesName || "Tama") + "!");
    }
    render();
  </script>
</body>
</html>
