<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamagotchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1f2328;
      --bg-mid: #3e4651;
      --shell-top: #f4e7b6;
      --shell-mid: #d9c98a;
      --shell-bottom: #b2975b;
      --shell-shadow: #7c6731;
      --shell-border: #4d3d1d;
      --screen-bg: #bfe4bb;
      --screen-border: #1d3b2d;
      --screen-text: #1c2c22;
      --button-top: #f4d7a4;
      --button-mid: #d59e58;
      --button-shadow: #7e5922;
      --button-border: #3b2b16;
      --white: #f9f5e8;
      --screen-panel: rgba(19, 41, 28, 0.05);
      --device-shadow: rgba(0, 0, 0, 0.32);
      --pet-shadow: rgba(21, 42, 28, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, var(--bg-mid), var(--bg-dark) 62%);
      font-family: "Press Start 2P", "Courier New", monospace;
      color: var(--screen-text);
      letter-spacing: 0.04em;
      overflow: hidden;
    }

    .device {
      position: relative;
      width: 380px;
      padding: 26px 18px 22px;
      background: linear-gradient(180deg, var(--shell-top) 0%, var(--shell-mid) 22%, var(--shell-bottom) 100%);
      border: 5px solid var(--shell-border);
      border-radius: 38px 38px 30px 30px;
      box-shadow:
        inset -10px -10px 0 rgba(92, 69, 24, 0.18),
        inset 8px 8px 0 rgba(255, 255, 255, 0.18),
        0 18px 26px var(--device-shadow),
        0 0 0 8px rgba(255,255,255,0.05);
    }

    .device::before,
    .device::after {
      content: "";
      position: absolute;
      top: 16px;
      width: 68px;
      height: 14px;
      background: rgba(122, 96, 36, 0.28);
      border-radius: 999px;
      z-index: 0;
    }

    .device::before {
      left: 22px;
    }

    .device::after {
      right: 22px;
    }

    .speaker {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .speaker span {
      display: block;
      width: 6px;
      height: 6px;
      background: rgba(58, 48, 27, 0.7);
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 340px;
      padding: 16px 12px 12px;
      background: linear-gradient(180deg, #d8f0d3 0%, var(--screen-bg) 100%);
      border: 6px solid var(--screen-border);
      border-radius: 18px;
      box-shadow:
        inset 0 0 0 4px rgba(17, 38, 28, 0.15),
        inset 0 0 0 10px rgba(125, 157, 116, 0.2);
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0) 28%,
        rgba(0,0,0,0.06) 100%
      );
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      line-height: 1.5;
      text-transform: uppercase;
      color: var(--screen-text);
    }

    .bars {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 9px;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .bars div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      gap: 8px;
    }

    .bar {
      position: relative;
      width: 126px;
      height: 11px;
      background: rgba(29, 55, 39, 0.12);
      border: 2px solid rgba(23, 44, 33, 0.9);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .bar span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2f8a4a, #184a2f);
      transition: width 0.35s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    .pet-area {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      margin-top: 8px;
      border-radius: 10px;
      background: var(--screen-panel);
      overflow: hidden;
    }

    .pet-area::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid rgba(29, 55, 39, 0.14);
      border-radius: 8px;
    }

    #pet {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 170px;
      height: 140px;
      user-select: none;
      transform-origin: center bottom;
      transition: filter 0.2s ease, transform 0.2s ease;
      z-index: 1;
    }

    .pet-svg {
      display: block;
      width: 170px;
      height: 140px;
      filter: drop-shadow(3px 3px 0 var(--pet-shadow));
    }

    .egg #pet {
      animation: eggFloat 1.4s ease-in-out infinite;
    }

    .hatching #pet {
      animation: hatchPulse 0.8s ease-in-out infinite alternate;
    }

    .bounce {
      animation: bounce 0.45s steps(2, end);
    }

    @keyframes eggFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-10px) rotate(2deg) scale(1.04); }
    }

    @keyframes hatchPulse {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.08) rotate(3deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .sleeping .pet-svg {
      filter: grayscale(0.4) brightness(0.85) drop-shadow(3px 3px 0 var(--pet-shadow));
    }

    #poop {
      position: absolute;
      right: 18px;
      bottom: 14px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      min-height: 10px;
      z-index: 1;
    }

    .poop-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6a4b39;
      opacity: 0.8;
    }

    #message {
      position: relative;
      z-index: 1;
      min-height: 50px;
      padding-top: 10px;
      font-size: 9px;
      line-height: 1.5;
      text-align: center;
      text-transform: uppercase;
      color: var(--screen-text);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 8px;
      margin-top: 18px;
      position: relative;
      z-index: 2;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    button {
      position: relative;
      width: 62px;
      height: 62px;
      border: 4px solid var(--button-border);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--button-top) 0%, var(--button-mid) 100%);
      color: var(--white);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--button-shadow);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      text-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--button-shadow);
    }

    .label {
      margin-top: 8px;
      font-size: 8px;
      line-height: 1.5;
      text-transform: uppercase;
      color: #f9f5e8;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }

    .reset {
      display: block;
      margin: 20px auto 0;
      min-width: 126px;
      height: auto;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08);
      font-size: 8px;
      color: var(--white);
      box-shadow: none;
    }

    @media (max-width: 420px) {
      .device {
        width: min(90vw, 380px);
      }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="speaker" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="screen" id="screen">
      <div class="top">
        <span id="name">Egg</span>
        <span id="age">Age: 0</span>
      </div>

      <div class="bars">
        <div>Hunger <span class="bar"><span data-bar="hunger"></span></span></div>
        <div>Happy <span class="bar"><span data-bar="happy"></span></span></div>
        <div>Energy <span class="bar"><span data-bar="energy"></span></span></div>
      </div>

      <div class="pet-area">
        <div id="pet"></div>
        <div id="poop"></div>
      </div>

      <div id="message"></div>
    </div>

    <div class="buttons">
      <div class="btn-wrap">
        <button id="feedBtn" title="Feed">F</button>
        <div class="label">Feed</div>
      </div>
      <div class="btn-wrap">
        <button id="playBtn" title="Play">P</button>
        <div class="label">Play</div>
      </div>
      <div class="btn-wrap">
        <button id="sleepBtn" title="Sleep / Wake">Z</button>
        <div class="label">Sleep</div>
      </div>
      <div class="btn-wrap">
        <button id="cleanBtn" title="Clean">C</button>
        <div class="label">Clean</div>
      </div>
    </div>

    <button class="reset" id="resetBtn">New pet</button>
  </div>

  <script>
    const SAVE_KEY = "tamagotchi-save-v1";
    const MAX_CATCHUP_SECONDS = 3600;
    const AGE_SECONDS_PER_STAGE = 240;
    const HATCH_SECONDS = 4;

    const speciesOptions = [
      { name: "Pip", primary: "#7ec6a8", secondary: "#d9f5e9", accent: "#2d7a5d", ears: "short", tail: "round" },
      { name: "Momo", primary: "#b79ef7", secondary: "#efe7ff", accent: "#785dcb", ears: "pointed", tail: "curl" },
      { name: "Nori", primary: "#84d37d", secondary: "#e0ffd8", accent: "#2f7d4f", ears: "round", tail: "fan" },
      { name: "Bun", primary: "#f1c4c2", secondary: "#fff1ef", accent: "#d97973", ears: "long", tail: "poof" },
      { name: "Kiko", primary: "#f2b169", secondary: "#ffe9c8", accent: "#c66d33", ears: "short", tail: "round" },
      { name: "Dori", primary: "#96c8f7", secondary: "#e7f3ff", accent: "#4b7ec8", ears: "pointed", tail: "fan" }
    ];

    const el = {
      screen: document.getElementById("screen"),
      pet: document.getElementById("pet"),
      poop: document.getElementById("poop"),
      age: document.getElementById("age"),
      name: document.getElementById("name"),
      message: document.getElementById("message"),
    };

    let state = load() || newPet();

    function randomSpecies() {
      return speciesOptions[Math.floor(Math.random() * speciesOptions.length)];
    }

    function newPet() {
      const species = randomSpecies();
      return {
        hunger: 80,
        happy: 80,
        energy: 80,
        poop: 0,
        age: 0,
        starving: 0,
        asleep: false,
        alive: true,
        lastSeen: Date.now(),
        speciesInfo: species,
        speciesName: species.name,
        speciesColor: species.primary,
        egg: true,
        hatched: false,
        hatchTimer: 0,
      };
    }

    function clamp(v) {
      return Math.max(0, Math.min(100, v));
    }

    function say(text) {
      el.message.textContent = text;
    }

    function requireAlive() {
      if (!state.alive) {
        say("Tama is gone. Press New pet.");
        return false;
      }
      if (state.egg && !state.hatched) {
        say("The egg is hatching...");
        return false;
      }
      return true;
    }

    function bounce() {
      el.pet.classList.remove("bounce");
      void el.pet.offsetWidth;
      el.pet.classList.add("bounce");
    }

    function hatchPet() {
      state.egg = false;
      state.hatched = true;
      state.hatchTimer = 0;
      say("Peep! Hello, I'm " + state.speciesName + "!");
      bounce();
    }

    function update(dt) {
      if (!state.alive) return;

      if (state.egg && !state.hatched) {
        state.hatchTimer += dt;
        state.hunger = clamp(state.hunger - 0.02 * dt);
        state.happy = clamp(state.happy - 0.01 * dt);

        if (state.hatchTimer >= HATCH_SECONDS) {
          hatchPet();
        }
        return;
      }

      state.age += dt / AGE_SECONDS_PER_STAGE;

      if (state.asleep) {
        state.energy = clamp(state.energy + 2 * dt);
        state.hunger = clamp(state.hunger - 0.02 * dt);
        state.happy = clamp(state.happy - 0.02 * dt);
        if (state.energy >= 100) {
          state.asleep = false;
          say("Good morning! I'm awake.");
        }
      } else {
        state.energy = clamp(state.energy - 0.03 * dt);
        state.hunger = clamp(state.hunger - 0.05 * dt);
        state.happy = clamp(state.happy - 0.04 * dt);

        if (Math.random() < 0.01 * dt && state.poop < 4) {
          state.poop++;
        }
      }

      if (state.poop >= 3) {
        state.happy = clamp(state.happy - 0.05 * dt);
      }

      if (state.hunger <= 0) {
        state.starving += dt;
        if (state.starving > 60) {
          state.alive = false;
          say("Tama has passed away. Press New pet to start over.");
        }
      } else {
        state.starving = 0;
      }
    }

    function feed() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.hunger >= 100) return say("I'm too full!");
      state.hunger = clamp(state.hunger + 25);
      state.happy = clamp(state.happy + 3);
      say("Yum! Thank you!");
      bounce();
    }

    function play() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.energy < 15) return say("I'm too tired to play.");
      state.happy = clamp(state.happy + 20);
      state.energy = clamp(state.energy - 10);
      state.hunger = clamp(state.hunger - 5);
      say("Wheee! That was fun!");
      bounce();
    }

    function toggleSleep() {
      if (!requireAlive()) return;
      if (state.asleep) {
        state.asleep = false;
        say("I'm awake!");
      } else {
        state.asleep = true;
        say("Zzz...");
      }
    }

    function clean() {
      if (!requireAlive()) return;
      if (state.asleep) return say("Shh... I'm sleeping.");
      if (state.poop === 0) return say("Nothing to clean here.");
      state.poop--;
      state.happy = clamp(state.happy + 5);
      say("All clean!");
      bounce();
    }

    function getEarMarkup(species) {
      const ears = species.ears;
      if (ears === "long") {
        return `
          <path d="M62 36 L45 8 L58 27 L62 36 Z" fill="${species.primary}" />
          <path d="M88 36 L105 8 L92 27 L88 36 Z" fill="${species.primary}" />
        `;
      }
      if (ears === "pointed") {
        return `
          <path d="M62 36 L52 10 L70 28 L62 36 Z" fill="${species.primary}" />
          <path d="M88 36 L98 10 L80 28 L88 36 Z" fill="${species.primary}" />
        `;
      }
      return `
        <ellipse cx="60" cy="26" rx="12" ry="18" fill="${species.primary}" />
        <ellipse cx="90" cy="26" rx="12" ry="18" fill="${species.primary}" />
      `;
    }

    function getTailMarkup(species) {
      const tail = species.tail;
      if (tail === "curl") {
        return `<path d="M112 74 C130 70, 136 84, 126 96" fill="none" stroke="${species.primary}" stroke-width="8" stroke-linecap="round"/>`;
      }
      if (tail === "fan") {
        return `<path d="M111 76 C130 70, 136 82, 126 94 C120 88, 115 82, 111 76 Z" fill="${species.primary}" />`;
      }
      if (tail === "poof") {
        return `<circle cx="118" cy="76" r="10" fill="${species.primary}" />`;
      }
      return `<circle cx="116" cy="80" r="8" fill="${species.primary}" />`;
    }

    function getPetSvg() {
      if (state.egg && !state.hatched) {
        const crack = state.hatchTimer > HATCH_SECONDS * 0.7;
        return `
          <svg class="pet-svg" viewBox="0 0 170 140" aria-label="Egg" role="img">
            <g>
              <ellipse cx="85" cy="78" rx="46" ry="52" fill="#f5f9f5" stroke="#c6d7ce" stroke-width="4"/>
              <ellipse cx="85" cy="78" rx="36" ry="42" fill="#edf4ee"/>
              ${crack ? '<path d="M96 55 L109 67 L94 80" fill="none" stroke="#9a825f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />' : ''}
              <path d="M72 60 C80 48, 92 48, 100 60" fill="none" stroke="#dfe7df" stroke-width="3" stroke-linecap="round"/>
            </g>
          </svg>
        `;
      }

      const species = state.speciesInfo || speciesOptions[0];
      const asleep = state.asleep && state.hatched;
      const openMouth = state.happy < 35;
      const eyesClosed = asleep || state.hunger < 20 || state.energy < 20;
      const eyeY = eyesClosed ? 68 : 62;
      const pupilY = eyesClosed ? 68 : 62;
      const mouthY = openMouth ? 84 : 90;
      const mouthH = openMouth ? 8 : 3;

      return `
        <svg class="pet-svg" viewBox="0 0 170 140" aria-label="${state.speciesName}" role="img">
          <g>
            <ellipse cx="84" cy="104" rx="54" ry="12" fill="rgba(0,0,0,0.10)"/>
            ${getTailMarkup(species)}
            ${getEarMarkup(species)}
            <ellipse cx="85" cy="82" rx="38" ry="32" fill="${species.primary}"/>
            <ellipse cx="85" cy="82" rx="31" ry="25" fill="${species.secondary}" opacity="0.8"/>
            <path d="M58 95 Q85 108 112 95" fill="none" stroke="${species.accent}" stroke-width="4" stroke-linecap="round"/>
            <circle cx="70" cy="${eyeY}" r="4" fill="#1d2b22"/>
            <circle cx="100" cy="${eyeY}" r="4" fill="#1d2b22"/>
            ${eyesClosed ? '' : `<circle cx="70" cy="${pupilY}" r="2" fill="#FFFFFF"/>`}
            ${eyesClosed ? '' : `<circle cx="100" cy="${pupilY}" r="2" fill="#FFFFFF"/>`}
            <ellipse cx="85" cy="${mouthY}" rx="12" ry="${mouthH}" fill="none" stroke="${species.accent}" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="85" cy="91" rx="9" ry="7" fill="${species.accent}" opacity="0.35"/>
            <circle cx="64" cy="78" r="3" fill="${species.accent}" opacity="0.32"/>
            <circle cx="106" cy="78" r="3" fill="${species.accent}" opacity="0.32"/>
            ${state.happy < 30 ? '<path d="M61 103 Q85 108 109 103" fill="none" stroke="#2d7a5d" stroke-width="3" stroke-linecap="round"/>' : ''}
          </g>
        </svg>
      `;
    }

    function render() {
      el.pet.innerHTML = getPetSvg();
      el.pet.classList.toggle("bounce", false);
      el.screen.classList.toggle("sleeping", state.asleep && state.hatched);
      el.screen.classList.toggle("egg", state.egg && !state.hatched);
      el.screen.classList.toggle("hatching", state.egg && !state.hatched && state.hatchTimer > HATCH_SECONDS * 0.75);
      el.name.textContent = state.egg && !state.hatched ? "Egg" : (state.speciesName || "Tama");
      el.age.textContent = "Age: " + Math.floor(state.age);
      el.poop.innerHTML = Array.from({ length: Math.max(0, state.poop) }, () => '<span class="poop-dot"></span>').join("");

      document.querySelector('[data-bar="hunger"]').style.width = state.hunger + "%";
      document.querySelector('[data-bar="happy"]').style.width = state.happy + "%";
      document.querySelector('[data-bar="energy"]').style.width = state.energy + "%";
    }

    function save() {
      state.lastSeen = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);

        const elapsed = Math.min(
          Math.floor((Date.now() - saved.lastSeen) / 1000),
          MAX_CATCHUP_SECONDS
        );
        for (let i = 0; i < elapsed; i++) {
          update(1);
        }
        return saved;
      } catch (e) {
        return null;
      }
    }

    document.getElementById("feedBtn").addEventListener("click", feed);
    document.getElementById("playBtn").addEventListener("click", play);
    document.getElementById("sleepBtn").addEventListener("click", toggleSleep);
    document.getElementById("cleanBtn").addEventListener("click", clean);
    document.getElementById("resetBtn").addEventListener("click", () => {
      state = newPet();
      say("A new egg is warming up...");
      save();
      render();
    });

    setInterval(() => {
      update(1);
      render();
      save();
    }, 1000);

    if (!state.alive) {
      say("Tama is gone. Press New pet.");
    } else if (state.egg && !state.hatched) {
      say("A new egg is warming up...");
    } else {
      say("Peep! Hello, I'm " + (state.speciesName || "Tama") + "!");
    }
    render();
  </script>
</body>
</html>
